import net.minecraftforge.gradle.common.tasks.SignJar

plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

jarJar.enable()

mixin {
    add sourceSets.main, "controllable.refmap.json"
    config 'controllable.common.mixins.json'
    config 'controllable.forge.mixins.json'
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    def at = file("src/main/resources/META-INF/accesstransformer.cfg")
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    testCompileOnly.extendsFrom compileOnly
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("com.mrcrayfish:framework-forge:${minecraft_version}-${framework_version}")

    // Just Enough Items
    compileOnly fg.deobf("mezz.jei:jei-${jei_minecraft_version}-forge:${jei_version}")

    // EMI
    compileOnly fg.deobf("dev.emi:emi-forge:1.1.19+1.20.1")

    // Roughly Enough Items (fg.deobf isn't transitive)
    implementation fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
    implementation fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}")
    implementation fg.deobf("me.shedaniel:RoughlyEnoughItems-forge:${rei_version}")

    // SDL2 Library
    library jarJar("com.mrcrayfish:controllable-sdl:${controllable_sdl_version}") {
        jarJar.ranged(it, "[${controllable_sdl_version},)")
        transitive(false)
    }

    annotationProcessor("org.spongepowered:mixin:0.8.7:processor")
}

jar {
    finalizedBy('reobfJar')
}

tasks.named('jarJar') {
    archiveClassifier = 'release'
    from(rootProject.file("LICENSE_ControllableSDL"))
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_name}" }
    }
    finalizedBy('reobfJarJar')
}

jar {
    manifest {
        attributes([
            'MixinConfigs': "${mod_id}.common.mixins.json,${mod_id}.forge.mixins.json"
        ])
    }
}

tasks.register('signJar', SignJar) {
    dependsOn 'reobfJarJar'
    onlyIf {
        project.hasProperty('keyStore') || System.getenv("KEYSTORE")
    }
    keyStore = project.findProperty('keyStore') ?: System.getenv("KEYSTORE")
    alias = project.findProperty('keyStoreAlias') ?: System.getenv("KEYSTORE_ALIAS")
    storePass = project.findProperty('keyStorePass') ?: System.getenv("KEYSTORE_PASS")
    inputFile = outputFile = tasks.jarJar.archiveFile
}

jar.finalizedBy 'signJar'

// Ensure singing always happens after these tasks
signJar.mustRunAfter 'reobfJarJar'
signJar.mustRunAfter 'reobfJar'
signJar.mustRunAfter 'jar'

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

// Fixes forge appending "_mapped_" in POM
fg.component(publishing.publications.named("mavenJava").get() as MavenPublication)
