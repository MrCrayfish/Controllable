plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev' version '2.0.73'
    id 'de.undercouch.download' version '5.4.0'
}

neoForge {
    neoFormVersion = neo_form_version
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.add(at.absolutePath)
    }
}

configurations {
    compileOnly.extendsFrom library
}

dependencies {
    compileOnly "org.spongepowered:mixin:0.8.7"
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    compileOnly "com.mrcrayfish:framework-common:${minecraft_version}-${framework_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-common:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-gui:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-lib:${jei_version}"
    compileOnly "dev.emi:emi-xplat-mojmap:${emi_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-forge:${rei_version}" // Forge because mojmap
    library "com.mrcrayfish:controllable-sdl:${controllable_sdl_version}"
}

tasks.register('downloadMappings', Download) {
    src 'https://raw.githubusercontent.com/gabomdq/SDL_GameControllerDB/master/gamecontrollerdb.txt'
    dest 'src/main/resources/gamecontrollerdb.txt'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}