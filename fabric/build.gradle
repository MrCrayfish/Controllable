import net.fabricmc.loom.task.RemapJarTask

plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "com.mrcrayfish:framework-fabric:${minecraft_version}-${framework_version}"
    modCompileOnly "mezz.jei:jei-${jei_minecraft_version}-fabric:${jei_version}"
    modCompileOnly "dev.emi:emi-fabric:${emi_version}"
    modImplementation "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
    library include("com.mrcrayfish:controllable-sdl:${controllable_sdl_version}") {
        transitive(false)
    }
}

loom {
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

remapJar {
    addNestedDependencies = false
}

tasks.register('releaseJar', RemapJarTask) {
    dependsOn tasks.jar
    input = tasks.jar.archiveFile
    addNestedDependencies = true
    archiveClassifier = 'release'
}
build.finalizedBy('releaseJar')